name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Synthetic CLI smoke test
        run: |
          triage generate --out data/ci --seed 42
          triage ingest data/ci/events.json --db data/ci.duckdb
          triage ingest data/ci/events.jsonl --db data/ci.duckdb
          triage summary --db data/ci.duckdb
          triage detect --db data/ci.duckdb > data/findings.json
          python -c "import json; from pathlib import Path; r=json.loads(Path('data/findings.json').read_text()); assert r['events_analyzed']==132; assert len(r['findings'])==5"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install .
      - run: npm ci --ignore-scripts --prefix tests/browser
      - run: node tests/browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm test --prefix tests/browser
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-check
          path: tests/browser/artifacts/dashboard.png
