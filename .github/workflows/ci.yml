name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Synthetic CLI smoke test
        run: |
          triage generate --out data/ci --seed 42
          triage ingest data/ci/events.json --db data/ci.duckdb
          triage ingest data/ci/events.jsonl --db data/ci.duckdb
          triage summary --db data/ci.duckdb
          triage detect --db data/ci.duckdb > data/findings.json
          python -c "import json; from pathlib import Path; r=json.loads(Path('data/findings.json').read_text()); assert r['events_analyzed']==132; assert len(r['findings'])==5"
